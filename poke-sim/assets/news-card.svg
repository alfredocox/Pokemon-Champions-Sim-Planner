<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Battle Labs news card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.45" stop-color="#0d2a3a"/>
      <stop offset="1" stop-color="#13251b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
