# Pokemon Champion 2026 — Main CI
# Runs on every PR to main and every push to main.
#
# Jobs:
#   1. syntax          — node --check all source JS (fast, ~30s)
#   2. tests           — shared .js/.mjs fast and DB-contract gate
#   3. detect-changes  — checks battle, source, test and DB inputs
#   4. audit           — reusable battle audit for relevant changes
#
# Bundle freshness + sw cache bump are enforced by their own dedicated workflows.
#
# Test discovery and exclusions are owned by poke-sim/tools/run-project-gate.mjs.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ----------------------------------------------------------------
  # 1. SYNTAX CHECK
  # Fast gate. All JS source files must parse cleanly before anything else runs.
  # ----------------------------------------------------------------
  syntax:
    name: "Syntax Check"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check all JS source files
        run: |
          set -e
          FILES=(
            poke-sim/data.js
            poke-sim/engine.js
            poke-sim/ui.js
            poke-sim/storage_adapter.js
            poke-sim/supabase_adapter.js
            poke-sim/move_legality.js
            poke-sim/generated/champions_move_pools.js
            poke-sim/move_support.js
            poke-sim/replay_coach.js
            poke-sim/replay_learning.js
            poke-sim/strategy-injectable.js
            poke-sim/legality.js
            poke-sim/rulesets.js
            poke-sim/regmb_source_conversion.js
          )
          for f in "${FILES[@]}"; do
            echo "→ node --check $f"
            node --check "$f"
          done
          echo "✅ All source files pass syntax check."

  # ----------------------------------------------------------------
  # 2. TEST SUITE
  # Shared discovery includes fast and DB suites; live DB uses an isolated project.
  # Runs after syntax passes.
  # ----------------------------------------------------------------
  tests:
    name: "Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    needs: [syntax, detect-changes]
    # The isolated test project has shared fixture IDs; serialize its users.
    # A different repository/manual test runner must use a separate test project.
    concurrency:
      group: ${{ needs.detect-changes.outputs.live_db_relevant == 'true' && 'champions-supabase-test-project' || format('champions-offline-tests-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install locked dependencies
        id: dependencies
        working-directory: poke-sim
        run: npm ci

      - name: Run all test suites (auto-discovered, with exclusions)
        id: suite
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          LIVE_DB_RELEVANT: ${{ needs.detect-changes.outputs.live_db_relevant }}
        run: |
          set -euo pipefail
          cd poke-sim
          # Only turn on live DB smoke when the PR touches data / DB-relevant files.
          # UI-only and replay-only changes should not fail on unrelated hosted roster drift.
          if [ "$LIVE_DB_RELEVANT" = "true" ] && [ -n "$SUPABASE_TEST_URL" ] && [ -n "$SUPABASE_TEST_ANON_KEY" ]; then
            export SUPABASE_URL="$SUPABASE_TEST_URL"
            export SUPABASE_ANON_KEY="$SUPABASE_TEST_ANON_KEY"
            export SUPABASE_KEY="$SUPABASE_TEST_ANON_KEY"
            export RUN_LIVE_DB=1
            echo "live_db=true" >> "$GITHUB_OUTPUT"
            echo "🔗 Isolated Supabase test-project credentials configured for DB tests"
          else
            unset SUPABASE_URL
            unset SUPABASE_ANON_KEY
            unset SUPABASE_KEY
            unset RUN_LIVE_DB
            echo "⚠️  Live DB smoke disabled for this PR - DB tests will use mock/skip mode"
          fi
          
          # Use the same cross-platform discovery and classification gate as local work.
          npm test

      - name: Clean up isolated Supabase test data
        if: always() && steps.dependencies.outcome == 'success' && steps.suite.outputs.live_db == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: |
          cd poke-sim
          node -e "const { cleanupTestData } = require('./tests/_db_helpers.js'); cleanupTestData().catch(error => { console.error(error); process.exit(1); });"

  # ----------------------------------------------------------------
  # 3. DETECT ENGINE / DATA CHANGES
  # Uses dorny/paths-filter to check if engine.js or data.js changed.
  # Output is consumed by the audit job below.
  # Runs in parallel with tests (no dependency).
  # ----------------------------------------------------------------
  detect-changes:
    name: "Detect Engine/Data Changes"
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      live_db_relevant: ${{ steps.filter.outputs.live_db_relevant }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            engine:
              - 'poke-sim/engine.js'
              - 'poke-sim/data.js'
              - 'poke-sim/runtime_data.js'
              - 'poke-sim/source_truth.js'
              - 'poke-sim/move_support.js'
              - 'poke-sim/move_legality.js'
              - 'poke-sim/team_lab.js'
              - 'poke-sim/generated/pokemon_showdown_legal_data.js'
              - 'poke-sim/generated/**'
              - 'poke-sim/rulesets.js'
              - 'poke-sim/regmb_source_conversion.js'
              - 'poke-sim/battle_audit_manifest.json'
              - 'poke-sim/tools/run-battle-audit.mjs'
              - 'poke-sim/tools/generate-champions-move-pools.mjs'
              - 'poke-sim/tests/**'
              - 'poke-sim/package.json'
              - 'poke-sim/package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/battle-audit.yml'
              - '.agents/skills/pokemon-battle-audit/**'
              - '.codex/agents/battle-auditor.toml'
            live_db_relevant:
              - 'poke-sim/data.js'
              - 'poke-sim/db/**'
              - 'poke-sim/supabase_adapter.js'

  # ----------------------------------------------------------------
  # 4. BATTLE AUDIT (GATED)
  # Runs the reusable mechanics-fixture, parity, golden-trace, and seeded-stress
  # workflow whenever battle code, evidence, or tests change.
  # ----------------------------------------------------------------
  audit:
    name: "Battle Audit"
    needs: [tests, detect-changes]
    if: needs.detect-changes.outputs.engine == 'true'
    uses: ./.github/workflows/battle-audit.yml
