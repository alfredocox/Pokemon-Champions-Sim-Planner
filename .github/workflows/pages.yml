name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy site with Supabase runtime config
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: poke-sim/package-lock.json

      - name: Validate Champion sim artifact before deploy
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SUPABASE_ANON_KEY:-}" ]; then
            export SUPABASE_KEY="$SUPABASE_ANON_KEY"
            export RUN_LIVE_DB=1
            echo "Live Supabase seed parity enabled for Pages deploy."
          else
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY are required for production Pages deploys."
            exit 1
          fi
          cd poke-sim
          npm ci
          # Includes source-truth, legality and bundle contract suites once.
          npm run test:fast
          cd ..
          node poke-sim/tests/db_m2_seed_tests.js
          bash poke-sim/tools/check-bundle.sh

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Inject Supabase anon runtime config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY are required for production Pages deploys."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_ANON_KEY"]

          Path("poke-sim/local-credentials.js").write_text(
              "window.__SUPABASE_URL__ = " + json.dumps(url) + ";\n"
              "window.__SUPABASE_KEY__ = " + json.dumps(key) + ";\n",
              encoding="utf-8",
          )

          bundle = Path("poke-sim/pokemon-champion-2026.html")
          html = bundle.read_text(encoding="utf-8")
          html = html.replace(
              "window.__SUPABASE_URL__ = window.__SUPABASE_URL__ || '';",
              "window.__SUPABASE_URL__ = window.__SUPABASE_URL__ || " + json.dumps(url) + ";",
          )
          html = html.replace(
              "window.__SUPABASE_KEY__ = window.__SUPABASE_KEY__ || '';",
              "window.__SUPABASE_KEY__ = window.__SUPABASE_KEY__ || " + json.dumps(key) + ";",
          )
          bundle.write_text(html, encoding="utf-8")
          PY

          echo "Supabase anon runtime config injected for Pages artifact."

      - name: Generate deployed Pages artifact SHA manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path("poke-sim/pokemon-champion-2026.html")
          artifact_path = Path("poke-sim/generated/release_artifact.json")
          artifact = json.loads(artifact_path.read_text(encoding="utf-8"))
          bundle_bytes = bundle.read_bytes()
          deployed_sha = hashlib.sha256(bundle_bytes).hexdigest()

          repo_sha = artifact.get("bundle_sha256")
          repo_bytes = artifact.get("bundle_bytes")
          artifact["repo_bundle_sha256"] = repo_sha
          artifact["repo_bundle_bytes"] = repo_bytes
          artifact["bundle_sha256"] = deployed_sha
          artifact["bundle_bytes"] = len(bundle_bytes)
          artifact["hash_scope"] = "sha256 of deployed GitHub Pages HTML after runtime config injection"
          artifact["deploy_mutations"] = [
              "Supabase anon runtime config injection when repository secrets are present"
          ]

          artifact_path.write_text(json.dumps(artifact, indent=2) + "\n", encoding="utf-8")

          if artifact["bundle_sha256"] != hashlib.sha256(bundle.read_bytes()).hexdigest():
              raise SystemExit("release_artifact.json bundle_sha256 does not match deployed bundle bytes")
          PY

          echo "Deploy artifact SHA manifest generated for Pages upload."

      - name: Stage Pages artifact to match local repo layout
        run: |
          set -euo pipefail
          rm -rf pages-dist
          mkdir -p pages-dist/poke-sim
          cp index.html pages-dist/index.html
          cp .nojekyll pages-dist/.nojekyll
          runtime_files=(
            index.html pokemon-champion-2026.html style.css manifest.json sw.js
            icon-192.png icon-512.png local-credentials.js release_manifest.js
            app_shell.js data.js engine.js legality_evidence_package.js legality.js
            logger.js move_legality.js move_support.js regmb_source_conversion.js
            replay_coach.js replay_import_service.js replay_learning.js rulesets.js
            runtime_data.js sim_evidence.js source_truth.js storage_adapter.js
            strategy-injectable.js supabase_adapter.js team_lab.js ui.js
          )
          for file in "${runtime_files[@]}"; do
            install -m 0644 "poke-sim/$file" "pages-dist/poke-sim/$file"
          done
          cp -R poke-sim/assets pages-dist/poke-sim/assets
          mkdir -p pages-dist/poke-sim/generated
          generated_files=(
            news_feed.js pokemon_showdown_legal_data.js champions_move_overrides.js
            champions_move_pools.js
            pokemon_showdown_species_weights.js release_artifact.json
            source_registry.js source_sync_status.js tournament_catalog.js
            project_roadmap.js
          )
          for file in "${generated_files[@]}"; do
            install -m 0644 "poke-sim/generated/$file" "pages-dist/poke-sim/generated/$file"
          done
          test ! -e pages-dist/poke-sim/tests
          test ! -e pages-dist/poke-sim/db
          test ! -e pages-dist/poke-sim/reports
          test ! -e pages-dist/poke-sim/docs

      - name: Verify staged external release assets
        run: node poke-sim/tools/verify-release-assets.cjs pages-dist/poke-sim

      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: pages-dist

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
          error_count: 30
          reporting_interval: 10000
