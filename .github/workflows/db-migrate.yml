name: Supabase DB Migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: "Migration filename under poke-sim/db/migrations/"
        required: true
        default: "2026_05_12_align_reg_ma_meta_sources.sql"

permissions:
  contents: read

concurrency:
  group: supabase-db-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Require main branch
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Production migrations may only run from main."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client jq

      - name: Validate migration input
        id: migration
        env:
          MIGRATION_FILENAME: ${{ inputs.migration }}
        run: |
          set -euo pipefail
          migration="$MIGRATION_FILENAME"

          if [[ ! "$migration" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*\.sql$ ]]; then
            echo "::error::Migration must be a simple SQL filename."
            exit 1
          fi

          case "$migration" in
            /*|*..*|*/*)
              echo "::error::Migration must be a filename inside poke-sim/db/migrations/"
              exit 1
              ;;
          esac

          path="poke-sim/db/migrations/$migration"
          if [ ! -f "$path" ]; then
            echo "::error::Migration file not found: $path"
            exit 1
          fi

          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "filename=$migration" >> "$GITHUB_OUTPUT"

      - name: Apply migration
        env:
          SUPABASE_DB_URL_P: ${{ secrets.SUPABASE_DB_URL_P }}
          PGSSLROOTCERT: ${{ github.workspace }}/.github/certs/prod-ca-2021.crt
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL_P:-}" ]; then
            echo "::error::Missing production-scoped SUPABASE_DB_URL_P secret"
            exit 1
          fi

          path="${{ steps.migration.outputs.path }}"
          has_begin=false
          has_commit=false
          grep -Eiq '^[[:space:]]*BEGIN[[:space:]]*;' "$path" && has_begin=true
          grep -Eiq '^[[:space:]]*COMMIT[[:space:]]*;' "$path" && has_commit=true

          if [ "$has_begin" != "$has_commit" ]; then
            echo "::error::Migration must contain both BEGIN and COMMIT, or neither."
            exit 1
          fi

          if [ "$has_begin" = true ]; then
            psql "$SUPABASE_DB_URL_P" --set ON_ERROR_STOP=1 --file "$path"
          else
            psql "$SUPABASE_DB_URL_P" --set ON_ERROR_STOP=1 --single-transaction --file "$path"
          fi

      - name: Verify Reg M-A prior snapshot
        if: ${{ steps.migration.outputs.filename == '2026_05_12_align_reg_ma_meta_sources.sql' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and SUPABASE_ANON_KEY secrets are required for snapshot verification"
            exit 1
          fi

          api_url="${SUPABASE_URL%/}/rest/v1/prior_snapshots?prior_id=eq.reg_ma_meta_2026_05_12_public_sources&select=prior_id,usage_data"
          curl -fsS \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$api_url" > snapshot.json

          jq -e '
            length == 1 and
            .[0].prior_id == "reg_ma_meta_2026_05_12_public_sources" and
            (.[0].usage_data.pokestats_bo3_top | length) > 0
          ' snapshot.json > /dev/null

          echo "Verified prior_snapshots usage_data for Reg M-A public-source snapshot."
